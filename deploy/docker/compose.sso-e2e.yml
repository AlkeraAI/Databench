# Overlay for the live enterprise-SSO end-to-end test (ops/test/selfdeploy/compose-sso-e2e.sh).
# Layers ON TOP of compose.prod.example.yml:
#   docker compose -f compose.prod.example.yml -f compose.sso-e2e.yml up -d
#
# It adds a REAL external identity provider (Keycloak, as an enterprise would
# run) and points the OIDC callback at the in-network backend origin so the
# browser-simulating driver, the backend (discovery/token), and the IdP all see
# the SAME authority (keycloak:8080 / backend:8000), so the issuer and redirect
# always match.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Derive the issuer from the request authority. Every in-network party
      # reaches Keycloak as `keycloak:8080`, so iss is consistently that.
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ../ops/test/selfdeploy/keycloak/realm-acme.json:/opt/keycloak/data/import/realm-acme.json:ro
    # Published only so the harness can poll readiness from the host; the actual
    # OIDC flow stays in-network (keycloak:8080).
    ports:
      - "8088:8080"

  # The OIDC callback redirect_uri is built from API_PUBLIC_BASE_URL. Point it at
  # the in-network backend so the (in-network) browser-driver can follow the
  # callback and the URI matches the realm's registered redirect.
  backend:
    environment:
      API_PUBLIC_BASE_URL: http://backend:8000
