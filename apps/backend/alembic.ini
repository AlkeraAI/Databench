# Alembic config. Most values are driven from alembic/env.py so that
# the DB URL is read from the same pydantic settings the app uses.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC

# sqlalchemy.url is intentionally blank — env.py sets it from settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
