[project]
name = "alkera-worker"
version = "0.0.0"
description = "Background worker (Temporal workflows, activities and schedules)."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.32,<2",           # workflows + activities + the worker runtime
    "structlog>=24.4.0",
    "httpx>=0.27",                   # outbound self-hosted heartbeat to Alkera
    "alkera-core",                   # reuse settings, logging, models
    # [drivers] = the warehouse drivers the team-connection probe opens; the
    # worker is the ONLY app that installs them (backend/CLI stay bare).
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
