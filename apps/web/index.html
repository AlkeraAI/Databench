<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The brand fills the title at build time (src/vite/brandStatic.ts). -->
    <title></title>
    <!-- The colour scheme, settled before anything is painted. The token layer's base is the
         dark palette, so a machine set to light would flash a dark page for as long as the
         bundle takes to boot. Deliberately render-blocking (no defer/async/module) and ahead of
         everything that paints; a separate file rather than an inline block because the shipped
         image's default CSP is `script-src 'self'`. NOT loaded by vscode.html — the webview
         follows the host's theme. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
