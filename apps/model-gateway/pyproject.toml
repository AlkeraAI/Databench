[project]
name = "alkera-model-gateway"
version = "0.0.0"
description = "Alkera LLM model gateway — authenticated, metered proxy to Anthropic/OpenAI/Bedrock."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "pydantic>=2.8.0",
    "aioboto3>=13.0.0",
    # Input-token estimation for the admission hold (OpenAI families).
    # Optional at runtime: model_gateway.estimate degrades to its measured
    # characters-per-token calibration when the import or the encoding load
    # fails, so a deployment without it still prices requests.
    "tiktoken>=0.8.0",
    "alkera-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_gateway"]
