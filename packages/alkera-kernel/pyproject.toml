[project]
name = "alkera-kernel"
version = "0.0.0"
description = "The Alkera notebook kernel runtime, loaded by boot.py inside the kernel process (standard library only)."
license = "Apache-2.0"
requires-python = ">=3.10"
# Standard library only, by contract: the kernel is loaded from the platform
# mount into whatever interpreter the person's environment provides (3.10 to
# 3.14). The import ratchet in packages/alkera-notebook/tests pins it.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["_alkera_kernel"]
