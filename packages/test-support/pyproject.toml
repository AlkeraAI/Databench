[project]
name = "alkera-test-support"
version = "0.0.0"
description = "In-memory fakes the test suites drive the shared packages with (Docker, EC2, compute nodes, a fault-injecting object store, Stripe). Never a dependency of a shipped package."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "alkera-core",
    "botocore>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alkera_test_support"]
