[project]
name = "alkera-sdk"
version = "0.0.0"
description = "Typed Python client for the Alkera API. Generated from packages/shared-openapi/openapi.json."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7",
    "attrs>=24.1.0",
    "python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alkera_sdk"]
