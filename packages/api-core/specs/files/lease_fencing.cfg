\* Two contending holders, four epochs, a clock that stops at 8: enough for a
\* holder to be paused, lapse, be superseded, and try to write behind the new
\* epoch -- and small enough that TLC finishes in seconds.
SPECIFICATION Spec

CONSTANTS
    Holders = {h1, h2}
    NoHolder = none
    MaxEpoch = 4
    MaxClock = 8
    TTL = 2
    Grace = 1
    GenStride = 2
    MaxGen = 1
    MaxWrites = 2

INVARIANTS
    TypeOK
    SingleWriter
    EpochMonotonic
    NoStaleWrite

PROPERTIES
    EventuallyGrantable

\* The only terminal states are the bounds themselves: the clock has stopped at
\* MaxClock and the next epoch would exceed MaxEpoch, so no action is enabled.
\* That is the state-space bound, not a stuck protocol -- liveness is checked by
\* EventuallyGrantable, which holds in exactly those states.
CHECK_DEADLOCK FALSE
