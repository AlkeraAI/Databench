\* Two store keys, two sessions, a clock that stops at 4 and a two-tick
\* recovery window: enough for the dangerous behaviour -- a session dies, its
\* object is scanned as garbage, moved, expires, and a SECOND session writes the
\* same key and commits while the sweep still holds the stale candidate -- and
\* small enough that TLC finishes in seconds.
SPECIFICATION Spec

CONSTANTS
    Objects = {ob1, ob2}
    Sessions = {s1, s2}
    NoSession = nobody
    MaxClock = 4
    Window = 2

INVARIANTS
    TypeOK
    NoDanglingReference
    NoLostObject
    NoOverwriteInPlace

\* The only terminal states are the bounds themselves: the clock has stopped at
\* MaxClock, both sessions are finished and the sweep has nothing left to move,
\* so no action is enabled.  That is the state-space bound, not a stuck
\* protocol.
CHECK_DEADLOCK FALSE
