[project]
name = "alkera"
version = "0.0.0"
description = "The public Alkera Python API for notebooks and data tests (standard library only)."
license = "Apache-2.0"
requires-python = ">=3.8"
# Standard library only, by contract: this runs in the person's own environment,
# anywhere. The import ratchet in packages/alkera-notebook/tests pins it.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alkera"]
